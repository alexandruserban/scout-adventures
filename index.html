<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Forest Pixel Adventure: The Boy & The Evil Mushrooms</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 3D / 2D WebGL Game Canvas Container -->
  <div id="game-container"></div>

  <!-- CRT Retro Filter Overlay -->
  <div id="scanline-filter" class="scanline-overlay"></div>

  <!-- Main Game HUD -->
  <div id="hud">
    <div class="hud-left">
      <!-- Player Health Card -->
      <div class="hud-card">
        <div class="health-row">
          <span class="label">BOY HP:</span>
          <div id="hud-hearts"></div>
        </div>
      </div>

      <!-- Level Objective Card -->
      <div class="hud-card">
        <div id="hud-score" class="hud-score">MUSHROOMS DEFEATED: 0 / 4</div>
      </div>
    </div>

    <!-- Live State Inspector (Visualizing multiple states of boy & mushroom) -->
    <div class="hud-card state-inspector">
      <div class="inspector-title">⚡ STATE INSPECTOR</div>
      <div class="state-row">
        <span>BOY:</span>
        <span id="inspector-boy-state" class="state-badge">IDLE</span>
      </div>
      <div class="state-row">
        <span>ENEMY:</span>
        <span id="inspector-mushroom-state" class="state-badge">PATROL</span>
      </div>
    </div>
  </div>

  <!-- Controls & Shortcuts Guide Toolbar -->
  <div id="controls-bar">
    <div class="control-item">
      <span class="key-cap">A</span><span class="key-cap">D</span>
      <span>WALK</span>
    </div>
    <div class="control-item">
      <span class="key-cap">W</span> / <span class="key-cap">SPACE</span>
      <span>JUMP (x2 DOUBLE)</span>
    </div>
    <div class="control-item">
      <span class="key-cap">J</span> / <span class="key-cap">CLICK</span>
      <span>ATTACK</span>
    </div>
    <div class="control-item">
      <span class="key-cap">B</span>
      <span>BGM</span>
    </div>
    <div class="control-item">
      <span class="key-cap">R</span>
      <span>RESTART</span>
    </div>
    <button id="btn-music" class="hud-btn">🎵 MUSIC: OFF</button>
    <button id="btn-sound" class="hud-btn">🔊 SOUND: ON</button>
    <button id="btn-crt" class="hud-btn" title="Retro TV scanlines">📺 CRT: ON</button>
    <button id="btn-difficulty" class="hud-btn" title="Difficulty (restarts the game)">⚔️ NORMAL</button>
    <button id="btn-gallery" class="hud-btn">🎨 SPRITE GALLERY</button>
  </div>

  <!-- Touch Controls (Mobile / Click friendly) -->
  <div id="touch-controls">
    <div class="touch-cluster">
      <button class="touch-btn" id="btn-touch-left">◀</button>
      <button class="touch-btn" id="btn-touch-right">▶</button>
    </div>
    <button id="btn-menu-toggle" class="menu-toggle" aria-label="Menu" aria-expanded="false">☰</button>
    <div class="touch-cluster">
      <button class="touch-btn" id="btn-touch-jump">▲</button>
      <button class="touch-btn" id="btn-touch-atk">⚔</button>
    </div>
  </div>

  <!-- Wave announcements (fade in and out by themselves) -->
  <div id="wave-banner"></div>

  <!-- Game Over Overlay Modal -->
  <div id="game-overlay"></div>

  <!-- Sprite Art Showcase Modal -->
  <div id="gallery-overlay">
    <div class="gallery-card">
      <div class="gallery-header">
        <h2 class="gallery-title">PIXEL ART ASSET SHOWCASE</h2>
        <button id="btn-gallery-close" class="pixel-btn" style="padding: 6px 12px; font-size: 8px;">[X] CLOSE</button>
      </div>
      <div class="gallery-grid" id="gallery-content"></div>
    </div>
  </div>

  <!-- Three.js Library -->
  <script src="three.min.js"></script>

  <!--
    Game scripts. These are classic scripts sharing the window.Forest namespace (so the game
    also runs straight from disk); each one may only use scripts listed above it.
  -->
  <script src="src/namespace.js"></script>

  <!-- Core helpers -->
  <script src="src/core/config.js"></script>
  <script src="src/core/mathUtils.js"></script>
  <script src="src/core/difficulty.js"></script>
  <script src="src/core/graphics.js"></script>

  <!-- Pixel art, painted once at load time -->
  <script src="src/art/palette.js"></script>
  <script src="src/art/pixelCanvas.js"></script>
  <script src="src/art/mushroomSprites.js"></script>
  <script src="src/art/skyCreatureSprites.js"></script>
  <script src="src/art/environmentSprites.js"></script>
  <script src="src/art/boySprites.js"></script>
  <script src="src/art/backgroundPainters.js"></script>

  <!-- Audio -->
  <script src="src/audio/synth.js"></script>
  <script src="src/audio/soundEffects.js"></script>
  <script src="src/audio/music.js"></script>

  <!-- Page UI (toolbar buttons, touch buttons, gallery) -->
  <script src="src/ui/audioControls.js"></script>
  <script src="src/ui/crtFilter.js"></script>
  <script src="src/ui/difficultyControls.js"></script>
  <script src="src/ui/touchControls.js"></script>
  <script src="src/ui/spriteGallery.js"></script>

  <!-- Game -->
  <script src="src/game/levelData.js"></script>
  <script src="src/game/gameSprites.js"></script>
  <script src="src/game/stage.js"></script>
  <script src="src/game/parallaxBackground.js"></script>
  <script src="src/game/forestScenery.js"></script>
  <script src="src/game/particles.js"></script>
  <script src="src/game/ambientLeaves.js"></script>
  <script src="src/game/effects.js"></script>
  <script src="src/game/cameraController.js"></script>
  <script src="src/game/input.js"></script>
  <script src="src/game/hud.js"></script>
  <script src="src/game/player.js"></script>
  <script src="src/game/evilMushroom.js"></script>
  <script src="src/game/skyCreatures.js"></script>
  <script src="src/game/waveDirector.js"></script>
  <script src="src/game/main.js"></script>
</body>
</html>
